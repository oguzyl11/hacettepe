# Local fallback password. Override POSTGRES_PASSWORD in .env outside this file.
name: hacettepe

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hacettepe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: hacettepe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hacettepe -d hacettepe"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    image: hacettepe-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://hacettepe:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/hacettepe?schema=public&connect_timeout=5
    volumes:
      - ./prisma:/app/prisma:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    image: hacettepe-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hacettepe:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/hacettepe?schema=public&connect_timeout=5
      AUTH_SECRET: ${AUTH_SECRET:-dev-hacettepe-takas-local-docker}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  pgdata:
